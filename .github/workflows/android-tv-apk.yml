name: Build Royal Smart Home

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/royalsmarthome
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RoyalSmartHome"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.royalsmarthome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.royalsmarthome'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="Royal Smart Home"
                  android:banner="@drawable/banner">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#173B72"/>
              <corners android:radius="12dp"/>
          </shape>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/royalsmarthome/MainActivity.java <<'EOF'
          package com.royalsmarthome;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              int blue = Color.rgb(20, 76, 145);
              int light = Color.rgb(232, 238, 247);

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30,20,30,20);
                  root.setBackgroundColor(Color.rgb(245,247,250));

                  TextView title = new TextView(this);
                  title.setText("🏠  Royal Smart Home");
                  title.setTextSize(30);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setTextColor(blue);
                  title.setPadding(10,5,10,20);
                  root.addView(title);

                  GridLayout grid = new GridLayout(this);
                  grid.setColumnCount(2);
                  grid.setRowCount(4);

                  addButton(grid,"❄  Airco 1\nAan");
                  addButton(grid,"❄  Airco 2\nAan");
                  addButton(grid,"💡  Woonkamer lamp\nUit");
                  addButton(grid,"💡  Kantoor\nUit");
                  addButton(grid,"💡  Max lamp\nUit");
                  addButton(grid,"💡  Eetkamer\nUit");
                  addButton(grid,"💡  Eurodomest\nAan • 62%");
                  addButton(grid,"🌡  Heater 2\nUit");

                  root.addView(grid,new LinearLayout.LayoutParams(
                      -1,0,1));

                  TextView camera = new TextView(this);
                  camera.setText("📹  DB1C Deurbel\n\n                 Camera uit");
                  camera.setTextSize(22);
                  camera.setTextColor(Color.WHITE);
                  camera.setGravity(Gravity.CENTER_VERTICAL);
                  camera.setPadding(25,10,25,10);
                  camera.setBackgroundColor(Color.rgb(30,30,30));

                  root.addView(camera,new LinearLayout.LayoutParams(
                      -1,150));

                  setContentView(root);
              }

              void addButton(GridLayout grid,String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(20);
                  b.setTextColor(blue);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setBackgroundColor(light);

                  GridLayout.LayoutParams p =
                      new GridLayout.LayoutParams();
                  p.width = 0;
                  p.height = 0;
                  p.columnSpec = GridLayout.spec(GridLayout.UNDEFINED,1f);
                  p.rowSpec = GridLayout.spec(GridLayout.UNDEFINED,1f);
                  p.setMargins(8,8,8,8);

                  grid.addView(b,p);
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalSmartHome-APK
          path: app/build/outputs/apk/debug/app-debug.apk
